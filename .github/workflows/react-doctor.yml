name: React Doctor

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Historique complet : sans lui React Doctor ne peut pas calculer sa
          # base de comparaison et liste TOUS les problemes des fichiers
          # modifies, y compris ceux deja presents sur main (signale par
          # l'outil lui-meme sur la PR #150).
          fetch-depth: 0
      # Epingle sur un SHA (action tierce avec pull-requests: write) - audit
      # 2026-07-23. Mettre a jour le SHA volontairement, pas via @main mutable.
      - uses: millionco/react-doctor@54ba416f830952c30b6ddae7985ede8a251f0a5b # main 2026-07-23
